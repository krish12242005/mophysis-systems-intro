
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOPHYSIS SYSTEMS | Cinematic Experience</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#f7c875;--gold2:#ffe9b0;--dark:#030201}
html,body{width:100%;height:100%;overflow:hidden;background:#030201;color:white}
body{font-family:Montserrat,sans-serif}
#stage{
position:fixed;inset:0;overflow:hidden;
background:radial-gradient(ellipse at 50% 60%,#301403 0%,#100700 35%,#030201 78%);
}
#world{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
#ambient{
position:absolute;width:100vmax;height:100vmax;left:50%;top:50%;
transform:translate(-50%,-50%);
background:radial-gradient(circle,rgba(255,128,22,.19),rgba(255,87,0,.045) 35%,transparent 68%);
animation:ambient 3s ease-in-out infinite alternate;
}
@keyframes ambient{to{transform:translate(-50%,-50%) scale(1.25);opacity:.65}}
#rays{
position:absolute;inset:-50%;
background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg,transparent 10deg,rgba(255,188,83,.045) 11deg,transparent 13deg);
mask-image:radial-gradient(circle,black,transparent 68%);
animation:rotate 75s linear infinite;
}
@keyframes rotate{to{transform:rotate(360deg)}}
#hero{
position:absolute;width:min(75vw,700px);left:50%;top:54%;
transform:translate(-50%,-50%);
filter:drop-shadow(0 30px 30px #000);
}
#hero svg{width:100%;overflow:visible}
#heroSmoke{position:absolute;left:50%;top:23%;width:160px;height:230px;transform:translateX(-50%);pointer-events:none}
.smoke{
position:absolute;bottom:0;left:50%;width:45px;height:130px;
border-radius:50%;filter:blur(14px);
background:linear-gradient(90deg,transparent,rgba(180,170,150,.22),transparent);
animation:smoke 4s ease-out infinite;
}
.smoke:nth-child(2){animation-delay:1.4s;width:65px}
.smoke:nth-child(3){animation-delay:2.7s;width:35px}
@keyframes smoke{
0%{transform:translate(-50%,0) scale(.3);opacity:0}
20%{opacity:.45}
100%{transform:translate(35px,-190px) scale(2.2);opacity:0}
}
.flameA{
transform-origin:300px 245px;
animation:flame .17s ease-in-out infinite alternate;
filter:url(#flameGlow)
}
.flameB{
transform-origin:300px 245px;
animation:flame .13s ease-in-out infinite alternate-reverse;
}
@keyframes flame{
from{transform:rotate(-3deg) scaleX(.92) scaleY(1.04)}
to{transform:rotate(3deg) scaleX(1.08) scaleY(.95)}
}
#universe{
position:absolute;inset:0;
display:grid;grid-template-columns:repeat(10,1fr);
grid-template-rows:repeat(10,1fr);
gap:clamp(2px,1vw,12px);
padding:7vh 5vw;
opacity:0;transform:scale(3);
will-change:transform,opacity;
}
.lamp{
display:flex;align-items:center;justify-content:center;
opacity:0;transform:scale(.1);
animation:lampIn .7s cubic-bezier(.2,.8,.2,1) forwards;
animation-delay:var(--delay);
filter:drop-shadow(0 0 8px rgba(255,157,48,.45));
}
@keyframes lampIn{to{opacity:1;transform:scale(1)}}
.lamp svg{width:100%;height:100%;max-width:100px;overflow:visible}
.miniFire{
transform-origin:center bottom;
animation:miniFire .2s ease-in-out infinite alternate;
}
@keyframes miniFire{to{transform:scale(1.1,.92) rotate(3deg)}}
#effects{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#brand{
position:absolute;inset:0;z-index:4;
display:flex;align-items:center;justify-content:center;
flex-direction:column;text-align:center;padding:20px;
opacity:0;visibility:hidden;
background:radial-gradient(ellipse at center,rgba(40,18,2,.2),transparent 70%);
transition:opacity 2s,visibility 2s;
}
#brand.show{opacity:1;visibility:visible}
.line{
width:min(520px,70vw);height:1px;
background:linear-gradient(90deg,transparent,#b77b31,#fff0bd,#b77b31,transparent);
box-shadow:0 0 16px #e5a84f;
transform:scaleX(0);transition:transform 1.5s;
}
#brand.show .line{transform:scaleX(1)}
.eyebrow{
margin-top:28px;font-size:10px;letter-spacing:.65em;color:#d5a75d;
opacity:0;transition:opacity 1s 1s;
}
#brand.show .eyebrow{opacity:1}
.name{
font-family:Cinzel,serif;
font-size:clamp(34px,7.5vw,90px);
line-height:1.13;font-weight:600;letter-spacing:.08em;
margin:15px 0;
background:linear-gradient(180deg,#fff9df 0%,#f1c36d 48%,#9c5919 100%);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 22px rgba(255,184,79,.3));
opacity:0;transform:translateY(25px);
transition:all 1.5s 1.1s;
}
#brand.show .name{opacity:1;transform:translateY(0)}
.tagline{
font-size:clamp(9px,1.5vw,15px);
letter-spacing:.28em;color:#f2d5a0;
opacity:0;transition:opacity 1.5s 1.8s;
}
#brand.show .tagline{opacity:1}
.services{
margin-top:30px;font-size:clamp(8px,1.15vw,12px);
letter-spacing:.18em;color:#cdbd9f;
opacity:0;transition:opacity 1.5s 2.1s;
}
#brand.show .services{opacity:1}
.contact{
margin-top:42px;font-size:12px;line-height:2.1;
letter-spacing:.18em;color:#e9d2a7;
opacity:0;transition:opacity 1.5s 2.4s;
}
#brand.show .contact{opacity:1}
.contact strong{display:block;color:#fff0c6;font-weight:500}
#sweep{
position:absolute;inset:-20%;pointer-events:none;
background:linear-gradient(110deg,transparent 42%,rgba(255,224,159,.12) 50%,transparent 58%);
transform:translateX(-100%);
}
#brand.show #sweep{animation:sweep 5s 2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}45%,100%{transform:translateX(100%)}}
#grain{
position:absolute;inset:-50%;width:200%;height:200%;
opacity:.08;pointer-events:none;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
animation:grain .25s steps(2) infinite;
}
@keyframes grain{25%{transform:translate(1%,-1%)}50%{transform:translate(-1%,1%)}75%{transform:translate(1%,1%)}}
#controls{
position:absolute;z-index:10;bottom:25px;left:50%;
transform:translateX(-50%);display:flex;gap:12px;
}
button{
border:1px solid rgba(231,185,109,.5);
background:rgba(25,13,4,.7);color:#f2d29b;
padding:10px 20px;border-radius:30px;
font-size:10px;letter-spacing:.15em;cursor:pointer;
backdrop-filter:blur(10px);
}
button:hover{background:rgba(155,91,28,.4)}
#progress{
position:absolute;bottom:0;left:0;height:2px;width:0;
background:linear-gradient(90deg,#a25b1d,#fff0b8);
box-shadow:0 0 12px #ffca6b;z-index:11;
}
#intro{
position:absolute;bottom:15%;left:0;right:0;text-align:center;
font-size:10px;letter-spacing:.5em;color:#e4c18b;opacity:0;
transition:opacity 1s;
}
@media(max-width:600px){
#universe{padding:12vh 2vw;gap:2px}
.name{letter-spacing:.025em}
.tagline{letter-spacing:.1em}
.services{letter-spacing:.06em}
.contact{margin-top:25px}
}
</style>
</head>

<body>
<div id="stage">
<div id="ambient"></div>
<div id="rays"></div>

<div id="world">
<div id="hero">
<svg viewBox="0 0 600 440">
<defs>
<linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f7bd6b"/>
<stop offset=".3" stop-color="#a94c17"/>
<stop offset=".7" stop-color="#542009"/>
<stop offset="1" stop-color="#210a03"/>
</linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffe0a0"/>
<stop offset=".5" stop-color="#bf6827"/>
<stop offset="1" stop-color="#63240b"/>
</linearGradient>
<radialGradient id="oil">
<stop offset="0" stop-color="#ffcf64"/>
<stop offset="1" stop-color="#4b1905"/>
</radialGradient>
<linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#ff4b00"/>
<stop offset=".5" stop-color="#ff9d1c"/>
<stop offset="1" stop-color="#fff5b5"/>
</linearGradient>
<linearGradient id="innerFire" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#ff6500"/>
<stop offset="1" stop-color="#fff7ca"/>
</linearGradient>
<filter id="flameGlow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="11" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<ellipse cx="300" cy="375" rx="220" ry="28" fill="#000" opacity=".7"/>
<path d="M78 275 Q120 355 220 370 Q300 390 380 370 Q480 355 522 275 Q490 295 450 292 Q300 320 150 292Z" fill="url(#clay)" stroke="#9d4b19" stroke-width="3"/>
<ellipse cx="300" cy="278" rx="212" ry="35" fill="url(#oil)"/>
<path d="M78 275 Q300 218 522 275 Q500 312 300 317 Q100 312 78 275Z" fill="url(#rim)" stroke="#edaa5b" stroke-width="2"/>
<path d="M105 278 Q300 238 495 278" fill="none" stroke="#ffe1a4" stroke-width="3" opacity=".5"/>
<path d="M300 282 Q305 260 309 241" stroke="#190801" stroke-width="8" stroke-linecap="round"/>
<path class="flameA" d="M305 252 C245 205 282 155 308 75 C325 122 384 169 339 229 C330 241 318 250 305 252Z" fill="url(#fire)"/>
<path class="flameB" d="M308 248 C276 211 300 170 315 133 C326 172 359 207 324 244Z" fill="url(#innerFire)"/>
<path d="M310 247 C300 220 311 194 317 176 C330 208 329 232 310 247Z" fill="#fff8d5" opacity=".9"/>
</svg>
</div>

<div id="heroSmoke">
<div class="smoke"></div><div class="smoke"></div><div class="smoke"></div>
</div>

<div id="universe"></div>
</div>

<div id="intro">A LIGHT. A LEGACY. A NEW BEGINNING.</div>
<canvas id="effects"></canvas>

<div id="brand">
<div id="sweep"></div>
<div class="line"></div>
<div class="eyebrow">WELCOME TO</div>
<div class="name">MOPHYSIS<br>SYSTEMS</div>
<div class="tagline">DELIGHTING BREW CREATIVE EXPERIENCES</div>
<div class="services">FILMMAKING&nbsp; | &nbsp;BRAND CREATIVE&nbsp; | &nbsp;CONSULTING</div>
<div class="contact">
<strong>MAHANARANGAN K</strong>
9962228172
</div>
<div class="line" style="margin-top:30px"></div>
</div>

<div id="grain"></div>
<div id="controls">
<button onclick="replay()">↻ REPLAY</button>
<button onclick="skip()">SKIP INTRO →</button>
</div>
<div id="progress"></div>
</div>

<script>
const world=document.getElementById("world");
const hero=document.getElementById("hero");
const universe=document.getElementById("universe");
const brand=document.getElementById("brand");
const intro=document.getElementById("intro");
const progress=document.getElementById("progress");
const canvas=document.getElementById("effects");
const ctx=canvas.getContext("2d");

const DURATION=25000;
let start=0,raf=0,running=true,lastBurst=-1,particles=[];

function resize(){
const d=Math.min(devicePixelRatio||1,2);
canvas.width=innerWidth*d;
canvas.height=innerHeight*d;
canvas.style.width=innerWidth+"px";
canvas.style.height=innerHeight+"px";
ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize",resize);resize();

function createUniverse(){
universe.innerHTML="";
for(let i=0;i<100;i++){
const item=document.createElement("div");
item.className="lamp";
item.style.setProperty("--delay",(Math.random()*1.4)+"s");
item.innerHTML=`
<svg viewBox="0 0 100 80">
<defs>
<linearGradient id="c${i}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f6bd70"/>
<stop offset=".5" stop-color="#a64b16"/>
<stop offset="1" stop-color="#321006"/>
</linearGradient>
<linearGradient id="f${i}" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#ff5100"/>
<stop offset=".6" stop-color="#ffb82f"/>
<stop offset="1" stop-color="#fff5c1"/>
</linearGradient>
</defs>
<path d="M8 51 Q50 75 92 51 Q82 69 50 71 Q18 69 8 51Z" fill="url(#c${i})" stroke="#c17a38" stroke-width="1.5"/>
<ellipse cx="50" cy="51" rx="41" ry="8" fill="#77300c"/>
<path class="miniFire" d="M50 48 C35 35 48 22 52 7 C58 22 70 34 50 48Z" fill="url(#f${i})"/>
<text x="50" y="62" text-anchor="middle" font-size="5.3" font-family="Arial" font-weight="bold" fill="#ffe8b7">MOPHYSIS</text>
</svg>`;
universe.appendChild(item);
}
}
createUniverse();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(a,b,t){let x=clamp((t-a)/(b-a),0,1);return x*x*(3-2*x)}

function burst(x,y,n=75){
for(let i=0;i<n;i++){
let a=Math.random()*Math.PI*2,s=1+Math.random()*6;
particles.push({
x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
life:1,decay:.008+Math.random()*.018,
size:1+Math.random()*2.5
});
}
}

function drawParticles(){
ctx.clearRect(0,0,innerWidth,innerHeight);
particles=particles.filter(p=>p.life>0);
for(const p of particles){
p.x+=p.vx;p.y+=p.vy;
p.vx*=.985;p.vy*=.985;p.vy+=.015;
p.life-=p.decay;
ctx.globalAlpha=Math.max(0,p.life);
ctx.fillStyle="#ffd58a";
ctx.shadowBlur=12;ctx.shadowColor="#ff9b27";
ctx.beginPath();
ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function fireworks(t){
if(t<15000||t>25000)return;
let interval=Math.floor((t-15000)/850);
if(interval!==lastBurst){
lastBurst=interval;
burst(innerWidth*(.12+Math.random()*.76),innerHeight*(.1+Math.random()*.42),65);
}
}

function animate(now){
if(!running)return;
if(!start)start=now;
let t=now-start;

hero.style.opacity=1-ease(5700,8000,t);
let zoom=ease(0,7200,t);
world.style.transform=`scale(${1+zoom*8.5})`;

let grid=ease(5700,7800,t);
let out=ease(7800,15300,t);
universe.style.opacity=grid*(1-ease(14500,16500,t));
universe.style.transform=`scale(${2.7-out*2.35})`;

if(t>15000){
world.style.transform=`scale(${1-ease(15000,17500,t)*.04})`;
}

intro.style.opacity=ease(500,1600,t)*(1-ease(5200,6500,t));

if(t>15100)brand.classList.add("show");
else brand.classList.remove("show");

fireworks(t);
drawParticles();
progress.style.width=(clamp(t/DURATION,0,1)*100)+"%";

if(t<DURATION)raf=requestAnimationFrame(animate);
else running=false;
}

function replay(){
cancelAnimationFrame(raf);
particles=[];lastBurst=-1;start=0;running=true;
world.style.transform="scale(1)";
hero.style.opacity=1;
universe.style.opacity=0;
universe.style.transform="scale(3)";
brand.classList.remove("show");
intro.style.opacity=0;
progress.style.width=0;
createUniverse();
raf=requestAnimationFrame(animate);
}

function skip(){
cancelAnimationFrame(raf);running=false;
world.style.transform="scale(1)";
hero.style.opacity=0;
universe.style.opacity=0;
brand.classList.add("show");
progress.style.width="100%";
burst(innerWidth*.25,innerHeight*.25,110);
burst(innerWidth*.75,innerHeight*.25,110);
let count=0;
function finish(){
drawParticles();
if(++count<180&&particles.length)requestAnimationFrame(finish);
}
finish();
}
raf=requestAnimationFrame(animate);
</script>
</body>
</html>
